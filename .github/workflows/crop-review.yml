name: Verify focal crop review
on: [push, pull_request]
permissions:
  contents: read
jobs:
  geometry-and-dom:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: focal-crop-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
