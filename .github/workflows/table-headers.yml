name: Verify table header inspector
on: [push, pull_request]
permissions:
  contents: read
jobs:
  table-dom:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: complex-table-header-inspector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
