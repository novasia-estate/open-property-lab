name: PDF association fixtures
on:
  push:
    paths:
      - 'pdf-reading-order-kit/**'
      - '.github/workflows/pdf-reading-order.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
        working-directory: pdf-reading-order-kit
      - run: python -m unittest -v test_reading_order
        working-directory: pdf-reading-order-kit
      - run: python reading_order.py --output /tmp/association-results.json
        working-directory: pdf-reading-order-kit
